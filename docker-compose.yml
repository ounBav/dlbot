# Local development: the same image as production.
#   bot      Telegram long polling + in-process download workers + /health and Mini App /api on :8000
#   miniapp  static Mini App files on :5173
# No webhook, no tunnel: the bot pulls updates from Telegram (getUpdates), so it works behind NAT.
# Only ONE process may poll per bot token: running this with the production BOT_TOKEN while Render
# runs makes both get 409 Conflict. Use a separate dev bot token locally.
name: dlbot-bot

services:
  bot:
    build: .   # root Dockerfile (same file Render builds)
    image: dlbot-bot:local
    # Always rebuild on `docker compose up` (cached layers: seconds). Without this, compose reuses an
    # existing dlbot-bot:local image and silently runs stale code.
    pull_policy: build
    env_file: apps/bot/.env
    environment:
      TEMP_DIR: tmp
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Mini App static files on :5173 (live-mounted, no build). config.js points at http://localhost:8000.
  # Telegram only opens HTTPS Mini Apps: tunnel this port (ngrok) and set MINIAPP_URL + CORS_ORIGINS.
  miniapp:
    image: python:3.12-alpine
    command: python -m http.server 5173 --directory /srv
    volumes: ["./apps/miniapp:/srv:ro"]
    ports: ["5173:5173"]
