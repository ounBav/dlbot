# Render Blueprint: web webhook + background worker + Postgres + Key Value (Redis)
#
# Fast deploys: Render does NOT build anything. GitHub Actions (.github/workflows/deploy.yml)
# runs the tests, builds ONE image, pushes it to GHCR, then calls each service's deploy hook
# with ?imgURL=ghcr.io/ounbav/dlbot:<commit-sha>. Image-backed services never auto-deploy,
# so a push that fails tests never reaches Render. See RENDER_DEPLOY.md for first-time setup.
services:
  - type: web
    name: bot-webhook
    runtime: image
    image:
      url: ghcr.io/ounbav/dlbot:latest
      creds:
        fromRegistryCreds:
          name: ghcr-dlbot   # Workspace Settings → Container Registry Credentials
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TERMS_URL
        sync: false
      # Public URL of the bot-miniapp static site (e.g. https://bot-miniapp.onrender.com/).
      # Enables the Mini App menu button and is added to the API's CORS allow-list.
      - key: MINIAPP_URL
        sync: false
      - key: MINIAPP_AUTH_MAX_AGE
        value: "86400"
      - key: DB_HOST
        fromDatabase:
          name: bot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bot-db
          property: port
      - key: DB_SCHEMA
        fromDatabase:
          name: bot-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: bot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bot-db
          property: password
      - key: DB_CONNECTION
        value: postgres
      - key: DB_LOGGING
        value: "false"
      - key: DB_SYNC
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bot-redis
          property: connectionString
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: RATE_PER_MINUTE
        value: "5"
      - key: RATE_PER_DAY
        value: "30"
      - key: TEMP_DIR
        value: /tmp/dlbot

  - type: worker
    name: bot-worker
    runtime: image
    image:
      url: ghcr.io/ounbav/dlbot:latest   # same image as the web service
      creds:
        fromRegistryCreds:
          name: ghcr-dlbot
    plan: standard
    dockerCommand: python -m app.worker
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: bot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bot-db
          property: port
      - key: DB_SCHEMA
        fromDatabase:
          name: bot-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: bot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bot-db
          property: password
      - key: DB_CONNECTION
        value: postgres
      - key: DB_LOGGING
        value: "false"
      - key: DB_SYNC
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bot-redis
          property: connectionString
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: MAX_JOB_ATTEMPTS
        value: "3"
      - key: TEMP_DIR
        value: /tmp/dlbot

  # Telegram Mini App: static files from apps/miniapp, no dependencies. Render builds it (a copy
  # plus one generated config.js) and redeploys only when apps/miniapp changes.
  - type: web
    name: bot-miniapp
    runtime: static
    rootDir: apps/miniapp
    buildCommand: >-
      rm -rf dist && mkdir dist && cp -r index.html styles.css src dist/ &&
      printf 'window.MINIAPP_CONFIG = { apiBase: "%s" };\n' "${API_BASE_URL%/}" > dist/config.js
    staticPublishPath: dist
    buildFilter:
      paths: ["apps/miniapp/**"]
      ignoredPaths: ["apps/miniapp/tests/**", "apps/miniapp/**/*.md"]
    headers:
      # Files are not content-hashed: always revalidate so users get the new version after a deploy.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # No X-Frame-Options: Telegram Web (web.telegram.org) shows Mini Apps in an iframe.
    envVars:
      # Public URL of bot-webhook, e.g. https://bot-webhook.onrender.com (same as PUBLIC_BASE_URL).
      - key: API_BASE_URL
        sync: false

  - type: keyvalue
    name: bot-redis
    plan: starter
    # Must NOT evict: the job queue lives in Redis. Cache keys carry TTLs instead.
    maxmemoryPolicy: noeviction
    ipAllowList: []   # internal connections only

databases:
  - name: bot-db
    plan: basic-256mb
