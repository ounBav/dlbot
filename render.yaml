# Render Blueprint: ONE web service (Telegram long polling + in-process download workers) + the Mini App site.
#
# No Postgres, no Redis: state is an in-memory singleton (apps/bot/app/store.py), so the bot
# service must run as a single instance with a single process. A redeploy/restart clears the
# queue, bans, stats and the file_id cache (accepted for v1).
# Updates are pulled with getUpdates (no webhook), so the plan must not sleep when idle (no free plan).
# Render builds the root Dockerfile on every push to main (autoDeploy).
services:
  - type: web
    name: bot-webhook
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1          # in-memory state + one getUpdates consumer per token: never scale out
    healthCheckPath: /health
    autoDeploy: true
    # Only rebuild/redeploy when something inside the image changes (docs, tests, scripts and the
    # Mini App never trigger a bot deploy). Keep in sync with .dockerignore.
    buildFilter:
      paths: ["apps/bot/app/**", "apps/bot/requirements.txt", "Dockerfile", ".dockerignore", "render.yaml"]
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TERMS_URL
        sync: false
      # Public URL of the bot-miniapp static site (e.g. https://bot-miniapp.onrender.com/).
      # Enables the Mini App menu button and is added to the API's CORS allow-list.
      - key: MINIAPP_URL
        sync: false
      - key: MINIAPP_AUTH_MAX_AGE
        value: "86400"
      - key: POLL_TIMEOUT
        value: "25"
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: RATE_PER_MINUTE
        value: "5"
      - key: RATE_PER_DAY
        value: "30"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: MAX_JOB_ATTEMPTS
        value: "3"
      - key: TEMP_DIR
        value: tmp
      # Mini App "Save to device": file links expire (and files are deleted) after this many minutes.
      - key: FILE_TTL_MIN
        value: "15"
      - key: INFO_RATE_PER_MINUTE
        value: "20"
      # 0 = no length limit (CLAUDE.md open question Q4).
      - key: MAX_DURATION_SEC
        value: "0"

  # Telegram Mini App: static files from apps/miniapp, no dependencies. Render builds it (a copy
  # plus one generated config.js) and redeploys only when apps/miniapp changes.
  - type: web
    name: bot-miniapp
    runtime: static
    rootDir: apps/miniapp
    buildCommand: >-
      rm -rf dist && mkdir dist && cp -r index.html styles.css src dist/ &&
      printf 'window.MINIAPP_CONFIG = { apiBase: "%s", botUsername: "%s" };\n' "${API_BASE_URL%/}" "${BOT_USERNAME}" > dist/config.js
    staticPublishPath: dist
    buildFilter:
      paths: ["apps/miniapp/**"]
      ignoredPaths: ["apps/miniapp/tests/**", "apps/miniapp/**/*.md"]
    headers:
      # Files are not content-hashed: always revalidate so users get the new version after a deploy.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # No X-Frame-Options: Telegram Web (web.telegram.org) shows Mini Apps in an iframe.
    envVars:
      # Public URL of bot-webhook, e.g. https://bot-webhook.onrender.com .
      - key: API_BASE_URL
        sync: false
      # Bot username without @ (optional): "Open in Telegram" button when the page is opened in a browser.
      - key: BOT_USERNAME
        sync: false
