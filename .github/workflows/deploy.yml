# CI. Render itself builds the root Dockerfile and deploys on every push to main (render.yaml).
#   test         -> compileall + pytest
#   test-miniapp -> Mini App checks
#   docker       -> the production image still builds
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".env.example"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true   # a newer push supersedes an in-flight one

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bot   # monorepo: the bot lives in apps/bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/bot/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts tests
      - run: pytest -q

  # The Mini App is static files deployed by Render (service bot-miniapp); CI only tests it.
  test-miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test

  # Smoke-build the production image so a broken Dockerfile fails CI, not the Render deploy.
  docker:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dlbot:ci .
